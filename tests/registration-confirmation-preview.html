<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Clean Lanka registration confirmation preview</title>
<style>body{font:15px/1.5 system-ui;background:#eef7f1;color:#173d2a;margin:20px}#previews{display:flex;gap:24px;flex-wrap:wrap}iframe{width:360px;height:920px;border:1px solid #bddfcc;border-radius:18px;background:white}</style>
<h1>Customer and Worker email confirmation</h1><p>Synthetic preview only. No registration or email request is made.</p><div id="previews"></div>
<script>
(async()=>{const html=await(await fetch('../index.html',{cache:'no-store'})).text();const css=html.match(/<style id="cl-registration-confirmation-style">([\s\S]*?)<\/style>/)[1];const helper=html.slice(html.indexOf('  function showRegistrationConfirmation('),html.indexOf('  function showMessage('));
for(const role of ['customer','worker']){const frame=document.createElement('iframe');frame.title=role+' confirmation preview';document.getElementById('previews').append(frame);
const body='<section id="'+role+'-register"><h2>'+role+' registration</h2><form id="'+role+'RegisterForm"><input id="'+role+'Email"><p id="'+role+'RegisterMessage"></p><button type="button" id="'+role+'ResendConfirmation">Resend Confirmation Email</button></form></section><section id="previewLogin" hidden><h2>Login</h2><input id="loginEmail"><select id="loginRole"><option value="customer">Customer</option><option value="worker">Worker</option></select></section>';
const script=helper+"\nfunction openLoginPage(){document.getElementById('previewLogin').hidden=false;}function showMessage(el,text){el.textContent=text;}showRegistrationConfirmation('"+role+"','new.member@example.invalid');";
frame.srcdoc='<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:12px;font:15px/1.5 system-ui}button{cursor:pointer}button[id$="ResendConfirmation"]{padding:13px;border:1px solid #087b47;border-radius:12px;background:white;color:#087b47;font-weight:750}h2{font-size:20px;color:#104c30;text-transform:capitalize}</style><style>'+css+'</style>'+body+'<scr'+'ipt>'+script+'</scr'+'ipt>';
}})();
</script>
