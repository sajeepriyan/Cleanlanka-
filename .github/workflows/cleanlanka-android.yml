name: Clean Lanka Android Test APK

on:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/cleanlanka-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-debug:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Clean Lanka repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK tools
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK platform
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        working-directory: android-app
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Upload test APK for download
        uses: actions/upload-artifact@v4
        with:
          name: CleanLanka-Android-Test-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
